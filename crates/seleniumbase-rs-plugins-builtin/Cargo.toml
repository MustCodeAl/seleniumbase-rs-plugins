[package]
name = "seleniumbase-rs-plugins-builtin"
description = "The built-in seleniumbase-rs plugins behind one feature each, and a registry of the enabled ones"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["seleniumbase-rs", "plugin", "registry"]

[features]
# Nothing is on by default: seleniumbase-rs turns on the plugins a build wants,
# so a build with `plugin-shield` does not also compile the CRX unpacker.
default = []
shield = ["dep:seleniumbase-rs-plugin-shield"]
block-resources = ["dep:seleniumbase-rs-plugin-block-resources"]
crx = ["dep:seleniumbase-rs-plugin-crx"]
fetcher = ["dep:seleniumbase-rs-plugin-fetcher"]
extractor = ["dep:seleniumbase-rs-plugin-extractor"]
batcher = ["dep:seleniumbase-rs-plugin-batcher"]
crawler = ["dep:seleniumbase-rs-plugin-crawler"]
browser = ["dep:seleniumbase-rs-plugin-browser"]
imap = ["dep:seleniumbase-rs-plugin-imap"]

[dependencies]
seleniumbase-rs-plugin.workspace = true
seleniumbase-rs-plugin-shield = { workspace = true, optional = true }
seleniumbase-rs-plugin-block-resources = { workspace = true, optional = true }
seleniumbase-rs-plugin-crx = { workspace = true, optional = true }
seleniumbase-rs-plugin-fetcher = { workspace = true, optional = true }
seleniumbase-rs-plugin-extractor = { workspace = true, optional = true }
seleniumbase-rs-plugin-batcher = { workspace = true, optional = true }
seleniumbase-rs-plugin-crawler = { workspace = true, optional = true }
seleniumbase-rs-plugin-browser = { workspace = true, optional = true }
seleniumbase-rs-plugin-imap = { workspace = true, optional = true }

[dev-dependencies]
seleniumbase-rs-plugin-testing.workspace = true
serde_json.workspace = true
