[package]
name = "seleniumbase-rs-plugin-langchain"
description = "LangChain integration plugin for seleniumbase-rs: document loader and agent tool-calling interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["seleniumbase-rs", "plugin", "langchain", "llm", "ai"]

[dependencies]
seleniumbase-rs = { git = "https://github.com/MustCodeAl/seleniumbase-rs", branch = "main", default-features = false }
seleniumbase-rs-plugin = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
default = ["plugin"]
plugin = ["dep:seleniumbase-rs-plugin", "dep:async-trait"]

[dev-dependencies]
seleniumbase-rs-plugin-testing.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
