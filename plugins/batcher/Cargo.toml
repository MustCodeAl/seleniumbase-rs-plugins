[package]
name = "seleniumbase-rs-plugin-batcher"
description = "A seleniumbase-rs plugin that runs another plugin's jobs over a list of inputs with bounded concurrency, retries and a resume file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["seleniumbase-rs", "plugin", "batch", "chromium"]

[dependencies]
seleniumbase-rs-plugin.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
seleniumbase-rs-plugin-fetcher.workspace = true
seleniumbase-rs-plugin-testing.workspace = true
