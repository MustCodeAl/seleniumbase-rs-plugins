[package]
name = "seleniumbase-rs-plugin-browser"
description = "A seleniumbase-rs plugin that loads browser extensions from .zip and .crx files and unpacked folders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["seleniumbase-rs", "plugin", "browser", "extensions"]

[dependencies]
seleniumbase-rs-plugin.workspace = true
seleniumbase-rs-plugin-crx.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3.27"

[dev-dependencies]
seleniumbase-rs-plugin-testing.workspace = true
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
