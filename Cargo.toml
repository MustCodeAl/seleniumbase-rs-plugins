[workspace]
resolver = "3"
members = [
    "crates/seleniumbase-rs-plugin",
    "crates/seleniumbase-rs-plugin-testing",
    "crates/seleniumbase-rs-plugins-builtin",
    "plugins/batcher",
    "plugins/block-resources",
    "plugins/crawler",
    "plugins/crx",
    "plugins/extractor",
    "plugins/fetcher",
    "plugins/shield",
    "plugins/wasm",
]
exclude = ["template"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/MustCodeAl/seleniumbase-rs-plugins"

[workspace.dependencies]
seleniumbase-rs-plugin = { path = "crates/seleniumbase-rs-plugin" }
seleniumbase-rs-plugin-testing = { path = "crates/seleniumbase-rs-plugin-testing" }
seleniumbase-rs-plugin-batcher = { path = "plugins/batcher", version = "0.1" }
seleniumbase-rs-plugin-block-resources = { path = "plugins/block-resources", version = "0.1" }
seleniumbase-rs-plugin-crawler = { path = "plugins/crawler", version = "0.1" }
seleniumbase-rs-plugin-crx = { path = "plugins/crx", version = "0.1" }
seleniumbase-rs-plugin-extractor = { path = "plugins/extractor", version = "0.1" }
seleniumbase-rs-plugin-fetcher = { path = "plugins/fetcher", version = "0.1" }
seleniumbase-rs-plugin-shield = { path = "plugins/shield", version = "0.1" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
