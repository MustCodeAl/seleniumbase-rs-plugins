[workspace]
resolver = "3"
members = [
    "crates/seleniumbase-rs-plugin",
    "crates/seleniumbase-rs-plugin-testing",
    "crates/seleniumbase-rs-plugins-builtin",
    # Built-in plugins
    "plugins/batcher",
    "plugins/browser",
    "plugins/crawler",
    "plugins/crx",
    "plugins/extractor",
    "plugins/fetcher",
    "plugins/shield",
    # Community plugins
    "plugins/antibot-detector",
    "plugins/behavior-dataset",
    "plugins/block-resources",
    "plugins/cloud-logging",
    "plugins/imap",
    "plugins/langchain",
    "plugins/ocr",
    "plugins/owasp",
]
exclude = ["template"]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/MustCodeAl/seleniumbase-rs-plugins"

[workspace.dependencies]
seleniumbase-rs = { git = "https://github.com/MustCodeAl/seleniumbase-rs", branch = "main", default-features = false }
seleniumbase-rs-plugin = { path = "crates/seleniumbase-rs-plugin" }
seleniumbase-rs-plugin-testing = { path = "crates/seleniumbase-rs-plugin-testing" }
seleniumbase-rs-plugin-batcher = { path = "plugins/batcher", version = "0.10.0" }
seleniumbase-rs-plugin-browser = { path = "plugins/browser", version = "0.10.0" }
seleniumbase-rs-plugin-crawler = { path = "plugins/crawler", version = "0.10.0" }
seleniumbase-rs-plugin-crx = { path = "plugins/crx", version = "0.10.0" }
seleniumbase-rs-plugin-extractor = { path = "plugins/extractor", version = "0.10.0" }
seleniumbase-rs-plugin-fetcher = { path = "plugins/fetcher", version = "0.10.0" }
seleniumbase-rs-plugin-shield = { path = "plugins/shield", version = "0.10.0" }
async-trait = "0.1"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "sync", "time"] }
