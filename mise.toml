# Tools for working on seleniumbase-rs-plugins with mise (https://mise.jdx.dev): `mise install`.
# The GitLab CI jobs install the same ones (.gitlab-ci.yml), so a job and a local run use the
# same versions. Only version strings, so the file needs no `mise trust`.

[tools]
# rust-version of Cargo.toml; RUST_VERSION in .gitlab-ci.yml moves with it.
rust = "1.99"
cargo-deny = "0.20"
